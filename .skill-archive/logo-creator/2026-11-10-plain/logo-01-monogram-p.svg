<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Container: Minimal Dark Slate Squircle -->
  <rect width="128" height="128" rx="30" fill="#18181b"/>
  
  <!-- Subtle inner border for luxury depth -->
  <rect x="1" y="1" width="126" height="126" rx="29" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Geometric Stem (The Text Cursor) -->
  <rect x="38" y="32" width="12" height="64" rx="6" fill="#ffffff"/>
  
  <!-- The Loop of 'P' -->
  <path d="M 44 32 H 66 C 79.255 32 90 42.745 90 56 C 90 69.255 79.255 80 66 80 H 44" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Subtle plain-text accent: A precise center dot -->
  <circle cx="66" cy="56" r="3.5" fill="#18181b"/>
</svg>