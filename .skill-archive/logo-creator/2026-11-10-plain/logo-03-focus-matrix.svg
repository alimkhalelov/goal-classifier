<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Container: Minimal Dark Slate Squircle -->
  <rect width="128" height="128" rx="30" fill="#18181b"/>
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="126" height="126" rx="29" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Outer Minimalist Architectural Frame -->
  <rect x="32" y="32" width="64" height="64" rx="16" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" fill="none"/>
  
  <!-- Center Horizontal Baseline (The Plain Text Line) -->
  <line x1="44" y1="64" x2="84" y2="64" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Center Focal Intention: Crisp White Dot -->
  <circle cx="64" cy="48" r="5" fill="#ffffff"/>
</svg>